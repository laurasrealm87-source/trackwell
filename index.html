function norm(s){if(!s)return'';return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function pKey(n,a1,a2){return`${norm(n)}_${norm(a1)}_${norm(a2||'')}`}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`}
function fmtShort(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}`}
function today(){return new Date().toISOString().split('T')[0]}
function parseDec(v){if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.').replace(/[^0-9.]/g,''));return isNaN(n)?null:n}
function parseSteps(v){if(!v)return null;const n=parseInt(String(v).replace(/[^0-9]/g,''));return isNaN(n)?null:n}
function fmtLabel(v,unit){if(unit==='pasos'){if(v>=1000)return`${(v/1000).toFixed(1).replace('.',',')}k`;return String(v)}return v%1===0?String(v):v.toFixed(1)}

function findProfile(profiles,nombre,ap1,ap2){
  const nN=norm(nombre),nA1=norm(ap1);
  if(ap2){const found=profiles.find(p=>norm(p.nombre)===nN&&norm(p.apellido1)===nA1&&norm(p.apellido2)===norm(ap2));if(found)return{profile:found};}
  const matches=profiles.filter(p=>norm(p.nombre)===nN&&norm(p.apellido1)===nA1);
  if(matches.length===1)return{profile:matches[0]};
  if(matches.length>1)return{ambiguous:true};
  return null;
}

function outliers(vals){if(vals.length<4)return new Set();const s=[...vals].sort((a,b)=>a-b);const q1=s[Math.floor(s.length*.25)],q3=s[Math.floor(s.length*.75)],iqr=q3-q1;return new Set(vals.filter(v=>v<q1-1.5*iqr||v>q3+1.5*iqr))}

function makeChart(data,unit,color,dark=true){
  const valid=data.filter(d=>d.value!=null);
  const missing=data.filter(d=>d.value==null).map(d=>d.date);
  if(valid.length<2)return{svg:`<p style="color:var(--${dark?'admin-':''}muted);font-size:.82rem;padding:.5rem 0">Aún no hay suficientes datos.</p>`,missing,scrollable:false};
  const H=100,PL=36,PR=14,PT=14,PB=24;
  const SPACING=26; // px fijos por punto — evita que se amontonen al crecer el histórico
  const minLabelGap=34;
  const plotW=(valid.length-1)*SPACING;
  const W=PL+plotW+PR;
  const vals=valid.map(d=>d.value);
  const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
  const out=outliers(vals);
  const xOf=i=>PL+i*SPACING;
  const yOf=v=>PT+(1-(v-min)/range)*(H-PT-PB);
  const pts=valid.map((d,i)=>({x:xOf(i),y:yOf(d.value),v:d.value,date:d.date}));
  const pathD=pts.map((p,i)=>`${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const ticks=[0,1,2].map(i=>({v:min+(range/2)*i,y:yOf(min+(range/2)*i)}));
  const xIdx=new Set();let lastLabelX=-Infinity;
  pts.forEach((p,i)=>{if(i===0||i===pts.length-1||p.x-lastLabelX>=minLabelGap){xIdx.add(i);lastLabelX=p.x;}});
  const tc=dark?'rgba(200,180,150,0.6)':'rgba(100,90,80,0.55)';
  const gc=dark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)';
  const acol=dark?'rgba(255,255,255,0.1)':'rgba(0,0,0,0.08)';
  let inner=`<line x1="${PL-4}" y1="${PT}" x2="${PL-4}" y2="${H-PB}" stroke="${acol}" stroke-width="1"/>`;
  ticks.forEach(t=>{
    inner+=`<line x1="${PL-4}" y1="${t.y}" x2="${W-PR}" y2="${t.y}" stroke="${gc}" stroke-width="1"/>`;
    inner+=`<text x="${PL-10}" y="${t.y+3.5}" text-anchor="end" font-size="7" fill="${tc}">${fmtLabel(Math.round(t.v*10)/10,unit)}</text>`;
  });
  inner+=`<line x1="${PL-4}" y1="${H-PB+3}" x2="${W-PR}" y2="${H-PB+3}" stroke="${acol}" stroke-width="1"/>`;
  pts.forEach((p,i)=>{if(xIdx.has(i))inner+=`<text x="${p.x}" y="${H-PB+13}" text-anchor="middle" font-size="6.5" fill="${tc}">${fmtShort(p.date)}</text>`;});
  inner+=`<path d="${pathD}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{
    const isOut=out.has(p.v);const dc=isOut?'#e05555':color;
    const anchor=i===0?'start':i===pts.length-1?'end':'middle';
    inner+=`<circle cx="${p.x}" cy="${p.y}" r="${isOut?4.5:3}" fill="${dc}"/>`;
    if(isOut)inner+=`<circle cx="${p.x}" cy="${p.y}" r="7" fill="none" stroke="#e05555" stroke-width="1" opacity="0.5"/>`;
    inner+=`<text x="${p.x}" y="${p.y-6}" text-anchor="${anchor}" font-size="7" fill="${isOut?'#e05555':color}" opacity="0.9">${fmtLabel(p.v,unit)}</text>`;
  });
  const svgEl=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;min-width:${W}px;height:${H}px;display:block">${inner}</svg>`;
  const svg=`<div class="chart-scroll">${svgEl}</div>`;
  return{svg,missing,scrollable:valid.length>20};
}

let state={view:'landing',profiles:[],checkins:{},selectedProfileId:null,currentProfile:null,currentCheckins:[],selectedDate:today(),loading:false};
const app=document.getElementById('app');
function render(){
  app.innerHTML='';
  buildView();
  document.querySelectorAll('.chart-scroll').forEach(el=>{el.scrollLeft=el.scrollWidth;});
}

async function init(){
  render();
  const{data:existing}=await sb.from('profiles').select('id').limit(1);
  if(!existing||existing.length===0){
    state.loading=true;render();
    for(const p of SEED_PROFILES)await upsertProfile(p);
    for(const c of SEED_CHECKINS)await upsertCheckin(c);
  }
  state.profiles=await getProfiles();
  state.profiles.sort((a,b)=>`${a.nombre} ${a.apellido1}`.localeCompare(`${b.nombre} ${b.apellido1}`,'es'));
  // Load ALL checkins at startup so sidebar counts are correct immediately
  const{data:allCheckins}=await sb.from('checkins').select('*').order('date');
  if(allCheckins){
    allCheckins.forEach(c=>{
      if(!state.checkins[c.profile_id])state.checkins[c.profile_id]=[];
      state.checkins[c.profile_id].push(c);
    });
  }
  state.loading=false;render();
}

function buildView(){
  if(state.loading){app.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem;background:var(--bg)"><div class="spinner" style="width:32px;height:32px;border-width:3px"></div><div style="color:var(--muted);font-size:.9rem">Preparando la app por primera vez…</div></div>`;return;}
  if(state.view==='landing')buildLanding();
  else if(state.view==='adminLogin')buildAdminLogin();
  else if(state.view==='admin')buildAdmin();
  else if(state.view==='lookup')buildLookup();
  else if(state.view==='dateConfirm')buildDateConfirm();
  else if(state.view==='checkin')buildCheckin();
  else if(state.view==='intake')buildIntake();
  else if(state.view==='done')buildDone();
  else if(state.view==='intakeDone')buildIntakeDone();
}

  }

function buildLookup(){
  app.innerHTML=`<div class="shell"><div class="shell-header"><button class="back-btn" id="backBtn">←</button><span class="shell-title">Registro diario</span></div><div class="shell-content"><div class="lookup-box"><div class="lookup-title">¡Hola! 👋</div><div class="lookup-sub">Introduce tu nombre para continuar</div></div><div id="lookupError"></div><div class="form-row"><div class="form-group"><label class="form-label">Nombre <span class="required">*</span></label><input class="form-input" id="nombre"/></div><div class="form-group"><label class="form-label">1er apellido <span class="required">*</span></label><input class="form-input" id="ap1"/></div></div><div class="form-group"><label class="form-label">2º apellido <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(opcional)</span></label><input class="form-input" id="ap2"/><div class="form-hint">Solo necesario si hay otra clienta con el mismo nombre y primer apellido.</div></div><button class="btn btn-primary" id="continueBtn">Continuar →</button></div></div>`;
  document.getElementById('backBtn').onclick=()=>{state.view='landing';render();}
  const go=async()=>{
    const nombre=document.getElementById('nombre').value.trim(),ap1=document.getElementById('ap1').value.trim(),ap2=document.getElementById('ap2').value.trim();
    if(!nombre||!ap1){document.getElementById('lookupError').innerHTML='<div class="alert alert-error">Introduce al menos tu nombre y primer apellido.</div>';return;}
    const result=findProfile(state.profiles,nombre,ap1,ap2);
    if(!result){state.currentProfile={nombre,apellido1:ap1,apellido2:ap2,id:pKey(nombre,ap1,ap2)};state.view='intake';render();}
    else if(result.ambiguous){document.getElementById('lookupError').innerHTML='<div class="alert alert-error">Hay más de una clienta con ese nombre. Por favor añade tu segundo apellido.</div>';}
    else{
      if(ap2&&!result.profile.apellido2){await sb.from('profiles').update({apellido2:ap2}).eq('id',result.profile.id);state.profiles=await getProfiles();}
      state.currentProfile=result.profile;state.currentCheckins=await getCheckins(result.profile.id);state.selectedDate=today();state.view='dateConfirm';render();
    }
  };
  document.getElementById('continueBtn').onclick=go;
  document.getElementById('ap2').onkeydown=e=>{if(e.key==='Enter')go();}
}

function buildDateConfirm(){
  const p=state.currentProfile;
  const existing=state.currentCheckins;
  const prev=[...existing].sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
  app.innerHTML=`<div class="shell"><div class="shell-header"><button class="back-btn" id="backBtn">←</button><span class="shell-title">¡Hola, ${p.nombre}! 👋</span></div><div class="shell-content"><div class="date-confirm-box"><div class="date-confirm-title">¿Para qué día es este registro?</div><div class="form-group" style="margin-bottom:.75rem"><input type="date" class="form-input" id="selDate" value="${state.selectedDate}" max="${today()}"/></div><div id="dateError"></div><div style="font-size:.83rem;color:var(--muted);margin-bottom:1rem">Por defecto es hoy. Puedes cambiarlo si introduces datos de un día anterior sin registro.</div><button class="btn btn-primary" style="margin-top:0" id="continueBtn">Continuar →</button></div>${prev?`<div class="alert alert-info" style="font-size:.82rem">Último registro: ${fmtDate(prev.date)} · ${prev.steps!=null?prev.steps.toLocaleString():'–'} pasos · ${prev.weight??'–'} kg</div>`:''}</div></div>`;
  document.getElementById('backBtn').onclick=()=>{state.view='lookup';render();}
  document.getElementById('continueBtn').onclick=()=>{
    const d=document.getElementById('selDate').value;
    if(!d){document.getElementById('dateError').innerHTML='<div class="alert alert-error">Selecciona una fecha.</div>';return;}
    if(d>today()){document.getElementById('dateError').innerHTML='<div class="alert alert-error">No puedes registrar datos de fechas futuras.</div>';return;}
    if(existing.find(r=>r.date===d)){document.getElementById('dateError').innerHTML=`<div class="alert alert-error">Ya existe un registro para el ${fmtDate(d)}. No se puede modificar.</div>`;return;}
    state.selectedDate=d;state.view='checkin';render();
  };
}

function buildCheckin(){
  const p=state.currentProfile;
  const rows=[...state.currentCheckins].sort((a,b)=>a.date.localeCompare(b.date));
  const prev=[...rows].reverse()[0]||null;
  const colors={steps:'#82c896',weight:'#c8a96e',waist:'#8ab4c8',hip:'#b08ac8',thigh:'#c88aa0'};

  function clientChart(field,unit,color){
    const data=rows.map(r=>({date:r.date,value:r[field]??null}));
    const{svg,missing,scrollable}=makeChart(data,unit,color,false);
    const missingHTML=missing.length?`<div style="font-size:.68rem;color:#b08040;margin-top:.2rem"><span style="background:#e8d9b8;border-radius:3px;padding:1px 4px;margin-right:4px">Sin dato</span>${missing.map(d=>fmtShort(d)).join(', ')}</div>`:'';
    const hint=scrollable?`<div class="chart-scroll-hint">↔ Desliza para ver el historial completo</div>`:'';
    return`<div style="margin-top:.75rem"><div class="chart-wrap-light">${svg}${hint}${missingHTML}</div></div>`;
  }

  function fieldBlock(id,label,field,unit,color,required=false,hint=''){
    const lastVal=prev?.[field];
    const ph=lastVal!=null?`Último: ${lastVal}`:(required?'ej. 8000':'opcional');
    const hasData=rows.filter(r=>r[field]!=null).length>=2;
    return`<div class="field-section"><div class="field-section-title">${label}${required?' <span style="color:var(--accent)">*</span>':''}</div><input class="form-input${lastVal!=null?' ghost':''}" id="${id}" placeholder="${ph}" inputmode="${field==='steps'?'numeric':'decimal'}"/>${hint?`<div class="form-hint">${hint}</div>`:''}${hasData?clientChart(field,unit,color):''}</div>`;
  }

  app.innerHTML=`<div class="shell"><div class="shell-header"><button class="back-btn" id="backBtn">←</button><span class="shell-title">Registro del ${fmtDate(state.selectedDate)}</span></div><div class="shell-content"><div id="checkinError"></div>${fieldBlock('steps','Pasos','steps','pasos',colors.steps,true)}${fieldBlock('weight','Peso (kg)','weight','kg',colors.weight)}${fieldBlock('waist','Cintura (cm)','waist','cm',colors.waist)}${fieldBlock('hip','Cadera (cm)','hip','cm',colors.hip)}${fieldBlock('thigh','Muslo (cm)','thigh','cm',colors.thigh,false,'Si lo dejas vacío, se conservará la última medida registrada.')}<button class="btn btn-primary" id="saveBtn">Guardar registro →</button></div></div>`;

  document.getElementById('backBtn').onclick=()=>{state.view='dateConfirm';render();}
  document.getElementById('saveBtn').onclick=async()=>{
    const steps=parseSteps(document.getElementById('steps').value);
    if(!steps){document.getElementById('checkinError').innerHTML='<div class="alert alert-error">Los pasos son obligatorios.</div>';return;}
    const btn=document.getElementById('saveBtn');btn.disabled=true;btn.innerHTML='<div class="spinner"></div>';
    const prevEntry=[...rows].filter(r=>r.date<state.selectedDate).pop()||null;
    await upsertCheckin({profile_id:p.id,date:state.selectedDate,steps,weight:parseDec(document.getElementById('weight').value)??(prevEntry?.weight??null),waist:parseDec(document.getElementById('waist').value)??(prevEntry?.waist??null),hip:parseDec(document.getElementById('hip').value)??(prevEntry?.hip??null),thigh:parseDec(document.getElementById('thigh').value)??(prevEntry?.thigh??null)});
    state.view='done';render();
  };
}

function sectionTitle(text){
  return`<div style="font-family:'DM Serif Display',serif;font-size:1.1rem;margin:1.75rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)">${text}</div>`;
}

function buildIntake(){
  const p=state.currentProfile;
  app.innerHTML=`
  <div class="shell">
    <div class="shell-header"><button class="back-btn" id="backBtn">←</button><span class="shell-title">¡Bienvenida, ${p.nombre}!</span></div>
    <div class="shell-content">
      <div class="alert alert-info" style="margin-bottom:1.5rem">Antes de empezar, cuéntanos un poco sobre ti. Tu entrenadora tendrá toda esta información para acompañarte mejor.</div>
      <div id="intakeError"></div>
      ${sectionTitle('Datos personales')}
      <div class="form-group"><label class="form-label">Email <span class="required">*</span></label><input type="email" class="form-input" id="iEmail" placeholder="tu@email.com"/></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Edad</label><input class="form-input" id="iEdad" placeholder="ej. 35" inputmode="numeric"/></div>
        <div class="form-group"><label class="form-label">Altura (cm)</label><input class="form-input" id="iAltura" placeholder="ej. 165" inputmode="numeric"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Peso actual (kg)</label><input class="form-input" id="iPeso" placeholder="ej. 68,5" inputmode="decimal"/></div>
        <div class="form-group"><label class="form-label">Profesión</label><input class="form-input" id="iProfesion" placeholder="ej. Profesora"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Talla pantalón</label><input class="form-input" id="iTallaPantalon" placeholder="ej. 40"/></div>
        <div class="form-group"><label class="form-label">Talla camiseta</label><input class="form-input" id="iTallaCamiseta" placeholder="ej. M"/></div>
      </div>
      ${sectionTitle('Tu objetivo')}
      <div class="form-group">
        <label class="form-label">¿Qué quieres conseguir en estas 8 semanas?</label>
        <div class="form-hint" style="margin-bottom:.5rem">Indica kilos, talla o cambio físico. Ej: -5 kg, bajar una talla, perder grasa abdominal…</div>
        <textarea class="form-input" id="iObjetivo" rows="3" placeholder="Ej: Bajar 5 kg y perder grasa abdominal" style="resize:vertical"></textarea>
      </div>
      ${sectionTitle('Actividad física')}
      <div class="form-group">
        <label class="form-label">¿Entrenas actualmente?</label>
        <div style="display:flex;gap:.75rem;margin-top:.35rem">
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.9rem"><input type="radio" name="entrena" value="Sí"/> Sí</label>
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.9rem"><input type="radio" name="entrena" value="No"/> No</label>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">¿Cuántos días/semana?</label><input class="form-input" id="iDiasEntreno" placeholder="ej. 3" inputmode="numeric"/></div>
        <div class="form-group"><label class="form-label">Pasos diarios aprox.</label><input class="form-input" id="iPasosAprox" placeholder="ej. 8000" inputmode="numeric"/></div>
      </div>
      ${sectionTitle('Historial')}
      <div class="form-group">
        <label class="form-label">¿Has hecho dietas antes?</label>
        <div style="display:flex;gap:.75rem;margin-top:.35rem">
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.9rem"><input type="radio" name="dietas" value="Sí"/> Sí</label>
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.9rem"><input type="radio" name="dietas" value="No"/> No</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">¿Qué crees que te ha fallado?</label>
        <textarea class="form-input" id="iFalloDietas" rows="2" placeholder="Ej: La constancia, el hambre, no ver resultados…" style="resize:vertical"></textarea>
      </div>
      ${sectionTitle('Restricciones importantes')}
      <div class="form-group"><label class="form-label">¿Alguna condición médica relevante?</label><input class="form-input" id="iCondicion" placeholder="Ej: Lipedema, intolerancia a la lactosa… o Ninguna"/></div>
      <div class="form-group">
        <label class="form-label">¿Algún alimento que no consumas?</label>
        <textarea class="form-input" id="iRestricciones" rows="2" placeholder="Ej: Sin gluten, no como carne… o Ninguna" style="resize:vertical"></textarea>
      </div>
      <button class="btn btn-primary" id="saveBtn" style="margin-top:1.5rem">Enviar y empezar →</button>
      <div style="height:2rem"></div>
    </div>
  </div>`;
  document.getElementById('backBtn').onclick=()=>{state.view='lookup';render();}
  document.getElementById('saveBtn').onclick=async()=>{
    const email=document.getElementById('iEmail').value.trim();
    if(!email){document.getElementById('intakeError').innerHTML='<div class="alert alert-error">El email es obligatorio.</div>';window.scrollTo(0,0);return;}
    const btn=document.getElementById('saveBtn');btn.disabled=true;btn.innerHTML='<div class="spinner"></div>';
    const entrena=document.querySelector('input[name="entrena"]:checked')?.value||'';
    const historialDietas=document.querySelector('input[name="dietas"]:checked')?.value||'';
    const diasEntreno=document.getElementById('iDiasEntreno').value.trim();
    const actividad=[entrena?`Entrena: ${entrena}`:'',diasEntreno?`${diasEntreno} días/sem`:''].filter(Boolean).join(' · ');
    await upsertProfile({
      id:p.id,nombre:p.nombre,apellido1:p.apellido1,apellido2:p.apellido2||'',email,
      edad:parseInt(document.getElementById('iEdad').value)||null,
      altura:parseDec(document.getElementById('iAltura').value),
      peso_inicial:parseDec(document.getElementById('iPeso').value),
      profesion:document.getElementById('iProfesion').value.trim(),
      talla_pantalon:document.getElementById('iTallaPantalon').value.trim(),
      talla_camiseta:document.getElementById('iTallaCamiseta').value.trim(),
      objetivo:document.getElementById('iObjetivo').value.trim(),
      entrena,dias_entreno:diasEntreno,actividad,
      pasos_aprox:parseSteps(document.getElementById('iPasosAprox').value),
      historial_dietas:historialDietas,
      fallo_dietas:document.getElementById('iFalloDietas').value.trim(),
      condicion_medica:document.getElementById('iCondicion').value.trim(),
      restricciones_alimentarias:document.getElementById('iRestricciones').value.trim(),
      created_at:today(),
    });
    state.profiles=await getProfiles();
    state.profiles.sort((a,b)=>`${a.nombre} ${a.apellido1}`.localeCompare(`${b.nombre} ${b.apellido1}`,'es'));
    state.view='intakeDone';render();
  };
}

function buildIntakeDone(){
  app.innerHTML=`<div class="shell"><div class="shell-header"><span class="shell-title">trackwell</span></div><div class="shell-content" style="text-align:center;padding-top:4rem"><div style="font-size:3rem;margin-bottom:1rem">🎉</div><div style="font-family:'DM Serif Display',serif;font-size:1.6rem;margin-bottom:.5rem">¡Perfil creado!</div><div style="color:var(--muted);margin-bottom:.75rem">Tu entrenadora ya tiene toda tu información.</div><div style="color:var(--muted);margin-bottom:2rem">Ahora puedes hacer tu primer registro diario.</div><button class="btn btn-primary" id="checkinBtn" style="max-width:300px;margin:0 auto">Hacer mi primer registro →</button></div></div>`;
  document.getElementById('checkinBtn').onclick=async()=>{
    state.currentCheckins=await getCheckins(state.currentProfile.id);
    state.selectedDate=today();state.view='dateConfirm';render();
  };
}

function buildDone(){
  app.innerHTML=`<div class="shell"><div class="shell-header"><span class="shell-title">trackwell</span></div><div class="shell-content" style="text-align:center;padding-top:4rem"><div style="font-size:3rem;margin-bottom:1rem">✅</div><div style="font-family:'DM Serif Display',serif;font-size:1.6rem;margin-bottom:.5rem">¡Guardado!</div><div style="color:var(--muted);margin-bottom:2rem">Tu registro ha sido guardado. ¡Hasta mañana!</div><button class="btn btn-secondary" id="backBtn" style="width:auto">Volver al inicio</button></div></div>`;
  document.getElementById('backBtn').onclick=()=>{state.view='landing';state.currentProfile=null;state.currentCheckins=[];render();}
}

init();
</script>
</body>
</html>
